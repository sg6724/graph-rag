[project]
name = "medgraph"
version = "0.1.0"
description = "GraphRAG over FDA drug labels with a graph-aware semantic cache"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "networkx>=3.3",
    "numpy>=1.26",
    "fastembed>=0.4",
    "streamlit>=1.38",
    "pyvis>=0.3.2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls real network APIs (spends quota)", "db: needs DATABASE_URL (Postgres + pgvector)"]
addopts = "-m 'not live and not db'"
